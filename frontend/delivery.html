<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚚 Delivery — Gelateria Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00ff41" />
  <style>
    :root {
      --bg: #0d0d0d; --surface: #111; --surface2: #1a1a1a;
      --accent: #00ff41; --accent-dim: rgba(0,255,65,0.15);
      --text: #e0e0e0; --text-muted: #888; --border: #2a2a2a;
      --danger: #ff4444; --success: #00cc44;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg: #f0f2f5; --surface: #ffffff; --surface2: #e8eaed;
      --accent: #1a7a1a; --accent-dim: rgba(26,122,26,0.1);
      --text: #1a1a1a; --text-muted: #666; --border: #ddd;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; }

    nav { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-weight: 700; font-size: 1.2em; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.88em; padding: 5px 10px; border-radius: 6px; transition: background 0.2s, color 0.2s; }
    .nav-links a:hover, .nav-links a.active { background: var(--accent-dim); color: var(--accent); }
    #theme-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 1em; }

    main { max-width: 540px; margin: 0 auto; padding: 24px 20px; }
    h1 { font-size: 1.5em; margin-bottom: 8px; color: var(--accent); }
    .subtitle { color: var(--text-muted); font-size: 0.9em; margin-bottom: 24px; }

    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; box-shadow: var(--card-shadow); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 14px; outline: none;
      transition: border-color 0.2s; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .btn-submit { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: 700; font-size: 1em; cursor: pointer; transition: opacity 0.2s; margin-top: 4px; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .message { text-align: center; margin-top: 14px; font-size: 0.9em; padding: 10px 14px; border-radius: 8px; display: none; }
    .message.error { display: block; background: rgba(255,68,68,0.1); color: var(--danger); border: 1px solid rgba(255,68,68,0.3); }
    .message.success { display: block; background: rgba(0,204,68,0.1); color: var(--success); border: 1px solid rgba(0,204,68,0.3); }

    .confirm-card { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 28px 24px; box-shadow: var(--card-shadow); text-align: center; display: none; }
    .confirm-card.visible { display: block; }
    .confirm-icon { font-size: 3em; margin-bottom: 12px; }
    .confirm-card h2 { color: var(--accent); margin-bottom: 8px; }
    .confirm-card p { color: var(--text-muted); font-size: 0.9em; margin-bottom: 4px; }
    .confirm-pedido-id { font-size: 1.4em; font-weight: 700; color: var(--accent); margin: 10px 0; }
    .btn-novo { margin-top: 16px; padding: 10px 24px; background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 0.9em; }
    .btn-novo:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="landing.html">🍦 Gelateria Pro</a>
    <div class="nav-links">
      <a href="landing.html">🏠 Início</a>
      <a href="cardapio.html">🛒 Cardápio</a>
      <a href="delivery.html" class="active">🚚 Delivery</a>
      <a href="login.html" id="nav-login">🔐 Login</a>
      <span id="nav-user" style="display:none;font-size:0.88em;color:var(--text-muted)"></span>
      <button id="theme-btn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
    </div>
  </nav>

  <main>
    <h1>🚚 Pedido Delivery</h1>
    <p class="subtitle">Faça seu pedido para entrega</p>

    <div class="form-card" id="form-card">
      <form id="delivery-form" onsubmit="handleDelivery(event)">
        <div class="form-group">
          <label for="cliente-nome">Nome do cliente *</label>
          <input type="text" id="cliente-nome" required placeholder="Seu nome completo" />
        </div>
        <div class="form-group">
          <label for="endereco">Endereço de entrega *</label>
          <textarea id="endereco" required placeholder="Rua, número, bairro, complemento…"></textarea>
        </div>
        <div class="form-group">
          <label for="sabor-select">Sabor *</label>
          <select id="sabor-select" required>
            <option value="">Carregando sabores…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="quantidade">Quantidade *</label>
          <input type="number" id="quantidade" min="1" value="1" required />
        </div>
        <div class="form-group">
          <label for="metodo-pagamento">Método de pagamento *</label>
          <select id="metodo-pagamento" required>
            <option value="dinheiro">💵 Dinheiro</option>
            <option value="pix">📱 PIX</option>
            <option value="cartao_credito">💳 Cartão de Crédito</option>
            <option value="cartao_debito">💳 Cartão de Débito</option>
          </select>
        </div>
        <button type="submit" class="btn-submit" id="btn-submit">🚚 Fazer Pedido</button>
        <div class="message" id="form-msg"></div>
      </form>
    </div>

    <div class="confirm-card" id="confirm-card">
      <div class="confirm-icon">🎉</div>
      <h2>Pedido Confirmado!</h2>
      <p>Número do pedido:</p>
      <div class="confirm-pedido-id" id="confirm-id">#—</div>
      <p id="confirm-detail"></p>
      <button class="btn-novo" onclick="novoPedido()">➕ Fazer outro pedido</button>
    </div>
  </main>

  <script>
    const API = window.API_URL || (
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:5000' : ''
    );

    function toggleTheme() {
      var html = document.documentElement;
      var btn = document.getElementById('theme-btn');
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light'); btn.textContent = '☀️'; localStorage.setItem('theme', 'light');
      }
    }
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.addEventListener('DOMContentLoaded', function() {
        var b = document.getElementById('theme-btn'); if (b) b.textContent = '☀️';
      });
    }

    function updateNavAuth() {
      var user = null;
      try { user = JSON.parse(localStorage.getItem('gelateria_user') || 'null'); } catch(e) {}
      if (user && user.name) {
        document.getElementById('nav-login').style.display = 'none';
        var nu = document.getElementById('nav-user');
        nu.textContent = '👤 ' + user.name;
        nu.style.display = 'inline';
      }
    }

    function showMsg(txt, type) {
      var el = document.getElementById('form-msg');
      el.textContent = txt;
      el.className = 'message ' + type;
    }

    function loadSabores() {
      fetch(API + '/api/sabores')
        .then(function(r) { return r.json(); })
        .then(function(sabores) {
          var sel = document.getElementById('sabor-select');
          sel.innerHTML = '';
          var def = document.createElement('option');
          def.value = '';
          def.textContent = 'Selecione um sabor…';
          sel.appendChild(def);
          sabores.forEach(function(s) {
            var opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.nome + ' — R$ ' + parseFloat(s.preco).toFixed(2).replace('.', ',');
            sel.appendChild(opt);
          });
        })
        .catch(function() {
          var sel = document.getElementById('sabor-select');
          sel.innerHTML = '';
          var opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Erro ao carregar sabores';
          sel.appendChild(opt);
        });
    }

    function handleDelivery(e) {
      e.preventDefault();
      var nome = document.getElementById('cliente-nome').value.trim();
      var endereco = document.getElementById('endereco').value.trim();
      var saborId = parseInt(document.getElementById('sabor-select').value, 10);
      var quantidade = parseInt(document.getElementById('quantidade').value, 10);
      var metodo = document.getElementById('metodo-pagamento').value;

      if (!nome || !endereco || !saborId || !quantidade) {
        showMsg('Preencha todos os campos obrigatórios.', 'error');
        return;
      }

      var btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Enviando…';

      var observacao = 'Delivery — Cliente: ' + nome + ' | Endereço: ' + endereco;
      var token = localStorage.getItem('gelateria_token');
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      fetch(API + '/api/pedidos', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ sabor_id: saborId, quantidade: quantidade, metodo_pagamento: metodo, observacao: observacao })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok) {
            showMsg(res.data.error || 'Erro ao criar pedido.', 'error');
          } else {
            var pedido = res.data;
            document.getElementById('form-card').style.display = 'none';
            var confirmCard = document.getElementById('confirm-card');
            confirmCard.classList.add('visible');
            document.getElementById('confirm-id').textContent = '#' + pedido.id;
            var detail = document.getElementById('confirm-detail');
            detail.textContent = 'Entrega para: ' + nome;
          }
        })
        .catch(function(err) {
          showMsg('Erro de conexão: ' + err.message, 'error');
        })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = '🚚 Fazer Pedido';
        });
    }

    function novoPedido() {
      document.getElementById('confirm-card').classList.remove('visible');
      document.getElementById('form-card').style.display = '';
      document.getElementById('delivery-form').reset();
      document.getElementById('form-msg').className = 'message';
      loadSabores();
    }

    updateNavAuth();
    loadSabores();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
