<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛵 Delivery — Gelateria Pro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 0; }
    #page { max-width: 860px; margin: 0 auto; padding: 20px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--bg-header); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; }
    .page-header h1 { font-size: 1.2em; }
    .nav-links { display: flex; gap: 10px; align-items: center; }
    .nav-links a { color: var(--text-primary); text-decoration: none; font-size: 0.85em; border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 4px; transition: background 0.2s, color 0.2s; }
    .nav-links a:hover { background: var(--btn-hover-bg); color: var(--btn-hover-text); }

    .section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 1em; margin-bottom: 16px; }
    label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
    input, select, textarea { width: 100%; background: var(--bg-header); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 10px; border-radius: 6px; font-family: inherit; font-size: 0.9em; }
    .btn { background: var(--btn-hover-bg); color: var(--btn-hover-text); border: none; padding: 10px 24px; border-radius: 6px; font-family: inherit; cursor: pointer; font-size: 0.95em; margin-top: 12px; }
    .btn:hover { opacity: 0.85; }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 16px; border-radius: 6px; font-family: inherit; cursor: pointer; font-size: 0.85em; }

    /* Item list */
    .item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .item-row select { flex: 2; }
    .item-row input[type=number] { flex: 1; width: auto; }
    .item-row button { flex-shrink: 0; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em; }

    /* Frete box */
    .frete-box { background: var(--bg-header); border-radius: 6px; padding: 10px 14px; margin-top: 10px; font-size: 0.9em; display: none; }
    .frete-box.visible { display: block; }

    /* Timeline */
    .timeline { display: flex; justify-content: space-between; position: relative; padding: 20px 0; }
    .timeline::before { content: ""; position: absolute; top: 34px; left: 0; right: 0; height: 2px; background: var(--border-color); }
    .step { flex: 1; text-align: center; position: relative; z-index: 1; }
    .step-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-color); background: var(--bg-secondary); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85em; }
    .step.active .step-dot { background: var(--btn-hover-bg); border-color: var(--btn-hover-bg); color: var(--btn-hover-text); }
    .step.done .step-dot { background: var(--border-color); color: var(--btn-hover-text); }
    .step-label { font-size: 0.75em; color: var(--text-muted); }
    .step.active .step-label { color: var(--text-primary); }

    /* Status result */
    #order-result { display: none; }
    #track-id { background: var(--bg-header); padding: 8px 12px; border-radius: 6px; display: inline-block; font-weight: bold; }
    .eta-badge { display: inline-block; background: var(--btn-hover-bg); color: var(--btn-hover-text); padding: 4px 14px; border-radius: 20px; font-size: 0.9em; margin-top: 8px; }
  </style>
</head>
<body>
<div id="page">
  <header class="page-header">
    <h1>🛵 Delivery</h1>
    <div class="nav-links">
      <a href="index.html">⬅ Terminal</a>
      <a href="cardapio.html">🍦 Cardápio</a>
      <button onclick="toggleTheme()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);padding:3px 10px;cursor:pointer;border-radius:4px;font-family:inherit;">🌙</button>
    </div>
  </header>

  <!-- Order form -->
  <div class="section" id="order-form-section">
    <h2>📦 Novo Pedido</h2>
    <div id="items-list">
      <div class="item-row">
        <select class="sabor-sel"><option value="">Carregando...</option></select>
        <input type="number" class="qtd-input" value="1" min="1" max="99" placeholder="Qtd" />
        <button onclick="removeItem(this)">✕</button>
      </div>
    </div>
    <button class="btn-outline" onclick="addItem()" style="margin-top:8px;">+ Adicionar item</button>

    <label>Endereço de entrega</label>
    <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" />

    <label>CEP</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="cep" placeholder="00000-000" maxlength="9" style="flex:1;" oninput="formatCep(this)" />
      <button class="btn-outline" onclick="calcFrete()">Calcular frete</button>
    </div>
    <div class="frete-box" id="frete-box"></div>

    <label>Forma de pagamento</label>
    <select id="metodo">
      <option value="pix">PIX</option>
      <option value="cartao">Cartão de Crédito</option>
      <option value="dinheiro">Dinheiro</option>
    </select>

    <button class="btn" onclick="submitOrder()">🛵 Confirmar Pedido</button>
  </div>

  <!-- Order result & tracker -->
  <div class="section" id="order-result">
    <h2>✅ Pedido Confirmado!</h2>
    <p>Número do pedido: <span id="track-id"></span></p>
    <p id="order-total" style="margin-top:6px;color:var(--text-muted);"></p>
    <div class="timeline" id="timeline">
      <div class="step done" id="step-1"><div class="step-dot">📥</div><div class="step-label">Recebido</div></div>
      <div class="step" id="step-2"><div class="step-dot">👨‍🍳</div><div class="step-label">Preparando</div></div>
      <div class="step" id="step-3"><div class="step-dot">🛵</div><div class="step-label">A caminho</div></div>
      <div class="step" id="step-4"><div class="step-dot">✅</div><div class="step-label">Entregue</div></div>
    </div>
    <p id="track-msg" style="font-size:0.95em;"></p>
    <span id="eta-badge" class="eta-badge"></span>
    <br><br>
    <button class="btn-outline" onclick="newOrder()">Fazer novo pedido</button>
  </div>
</div>

<script>
const API = window.API_URL || "http://localhost:5000";
let flavors = [];
let currentOrderId = null;
let pollTimer = null;

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
}
applyTheme(localStorage.getItem("theme") || "dark");

async function loadFlavors() {
  try {
    const r = await fetch(`${API}/api/sabores`);
    flavors = await r.json();
  } catch {
    flavors = [{id:1,nome:"Chocolate",preco:10},{id:2,nome:"Morango",preco:9.5},{id:3,nome:"Baunilha",preco:8}];
  }
  document.querySelectorAll(".sabor-sel").forEach(s => populateSelect(s));
}

function populateSelect(sel) {
  sel.innerHTML = flavors.map(f => `<option value="${f.id}" data-preco="${f.preco}">${f.nome} — R$${parseFloat(f.preco).toFixed(2)}</option>`).join("");
}

function addItem() {
  const row = document.createElement("div");
  row.className = "item-row";
  row.innerHTML = `<select class="sabor-sel"></select><input type="number" class="qtd-input" value="1" min="1" max="99"/><button onclick="removeItem(this)">✕</button>`;
  document.getElementById("items-list").appendChild(row);
  populateSelect(row.querySelector(".sabor-sel"));
}

function removeItem(btn) {
  const rows = document.querySelectorAll(".item-row");
  if (rows.length > 1) btn.closest(".item-row").remove();
}

function formatCep(inp) {
  let v = inp.value.replace(/\D/g, "").substring(0, 8);
  if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
  inp.value = v;
}

async function calcFrete() {
  const cep = document.getElementById("cep").value;
  const box = document.getElementById("frete-box");
  try {
    const r = await fetch(`${API}/api/delivery/calcular-frete`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({cep}) });
    const d = await r.json();
    box.innerHTML = `📦 Frete: <strong>R$${d.frete.toFixed(2)}</strong> · Prazo: ${d.prazo_dias} dia(s) · Região: ${d.regiao}`;
    box.classList.add("visible");
  } catch { box.innerHTML = "Erro ao calcular frete."; box.classList.add("visible"); }
}

async function submitOrder() {
  const rows = document.querySelectorAll(".item-row");
  const itens = Array.from(rows).map(r => ({
    sabor_id: parseInt(r.querySelector(".sabor-sel").value),
    quantidade: parseInt(r.querySelector(".qtd-input").value) || 1
  }));
  const endereco = document.getElementById("endereco").value.trim();
  const cep = document.getElementById("cep").value.trim();
  const metodo = document.getElementById("metodo").value;

  if (!endereco) { alert("Informe o endereço de entrega."); return; }

  try {
    const r = await fetch(`${API}/api/delivery/pedido`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({itens, endereco, cep, metodo_pagamento: metodo})
    });
    const d = await r.json();
    if (!r.ok) { alert(d.error || "Erro ao criar pedido."); return; }
    currentOrderId = d.id;
    document.getElementById("track-id").textContent = `#${d.id}`;
    document.getElementById("order-total").textContent = `Total: R$${parseFloat(d.valor_total).toFixed(2)}`;
    document.getElementById("order-form-section").style.display = "none";
    document.getElementById("order-result").style.display = "block";
    updateTracker("recebido");
    pollTimer = setInterval(() => pollStatus(), 10000);
  } catch { alert("Erro de conexão."); }
}

async function pollStatus() {
  if (!currentOrderId) return;
  try {
    const r = await fetch(`${API}/api/delivery/pedido/${currentOrderId}/track`);
    const d = await r.json();
    updateTracker(d.status, d.mensagem, d.eta_min);
    if (d.status === "entregue" || d.status === "cancelado") clearInterval(pollTimer);
  } catch {}
}

function updateTracker(status, msg, eta) {
  const stepMap = { "recebido": 1, "preparando": 2, "a caminho": 3, "entregue": 4 };
  const current = stepMap[status] || 1;
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById(`step-${i}`);
    el.classList.remove("active", "done");
    if (i < current) el.classList.add("done");
    else if (i === current) el.classList.add("active");
  }
  if (msg) document.getElementById("track-msg").textContent = msg;
  if (eta !== undefined) document.getElementById("eta-badge").textContent = eta > 0 ? `⏱ ETA: ~${eta} min` : "✅ Concluído!";
}

function newOrder() {
  clearInterval(pollTimer);
  currentOrderId = null;
  document.getElementById("order-form-section").style.display = "block";
  document.getElementById("order-result").style.display = "none";
  document.getElementById("frete-box").classList.remove("visible");
}

loadFlavors();
</script>
</body>
</html>
