<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Analytics — Gelateria Pro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 0; }
    #page { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--bg-header); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; }
    .page-header h1 { font-size: 1.2em; }
    .nav-links { display: flex; gap: 10px; align-items: center; }
    .nav-links a { color: var(--text-primary); text-decoration: none; font-size: 0.85em; border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 4px; transition: background 0.2s; }
    .nav-links a:hover { background: var(--btn-hover-bg); color: var(--btn-hover-text); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    .section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; }
    .section h2 { font-size: 0.95em; margin-bottom: 14px; }
    canvas { max-width: 100%; }
    .refresh-note { font-size: 0.75em; color: var(--text-muted); margin-top: 8px; }

    /* Bar chart rows */
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.82em; }
    .bar-label { width: 80px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; background: var(--bg-header); height: 18px; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--border-color); border-radius: 4px; transition: width 0.6s ease; }
    .bar-val { width: 40px; text-align: right; color: var(--text-muted); flex-shrink: 0; }

    /* Heatmap */
    .heatmap-wrap { overflow-x: auto; }
    table.heatmap { border-collapse: collapse; font-size: 0.7em; width: 100%; }
    table.heatmap th { padding: 2px 4px; color: var(--text-muted); font-weight: normal; text-align: center; }
    table.heatmap td { width: 20px; height: 16px; text-align: center; border-radius: 2px; }

    /* NPS meter (SVG) */
    #nps-wrap { text-align: center; }
    #nps-label { font-size: 2em; font-weight: bold; margin-top: -10px; }
    #nps-sub { font-size: 0.8em; color: var(--text-muted); }

    /* Sparkline */
    #sparkline-wrap { overflow-x: auto; }
    svg.sparkline { width: 100%; height: 80px; }
  </style>
</head>
<body>
<div id="page">
  <header class="page-header">
    <h1>📊 Analytics</h1>
    <div class="nav-links">
      <a href="index.html">⬅ Terminal</a>
      <a href="cardapio.html">🍦 Cardápio</a>
      <a href="ranking.html">🏆 Ranking</a>
      <button onclick="toggleTheme()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);padding:3px 10px;cursor:pointer;border-radius:4px;font-family:inherit;">🌙</button>
    </div>
  </header>

  <div class="grid2">
    <!-- Popular flavors bar chart -->
    <div class="section">
      <h2>🍨 Sabores Populares (30 dias)</h2>
      <div id="flavors-chart"></div>
    </div>
    <!-- NPS meter -->
    <div class="section">
      <h2>⭐ Satisfação (NPS)</h2>
      <div id="nps-wrap">
        <svg viewBox="0 0 200 110" style="width:180px;height:auto;display:block;margin:0 auto;">
          <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--bg-header)" stroke-width="18" stroke-linecap="round"/>
          <path id="nps-arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--border-color)" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 251"/>
        </svg>
        <div id="nps-label">–</div>
        <div id="nps-sub">Calculando NPS...</div>
        <p style="font-size:0.78em;color:var(--text-muted);margin-top:8px;" id="nps-detail"></p>
      </div>
    </div>
  </div>

  <div class="grid2">
    <!-- Peak hours bar chart -->
    <div class="section">
      <h2>⏰ Horários de Pico</h2>
      <canvas id="hours-canvas" height="140"></canvas>
    </div>
    <!-- Revenue sparkline -->
    <div class="section">
      <h2>💰 Receita Mensal (12 meses)</h2>
      <div id="sparkline-wrap"><svg class="sparkline" id="sparkline"></svg></div>
      <div id="sparkline-labels" style="display:flex;justify-content:space-between;font-size:0.68em;color:var(--text-muted);margin-top:4px;"></div>
    </div>
  </div>

  <!-- Heatmap -->
  <div class="section" style="margin-bottom:16px;">
    <h2>🗓 Mapa de Calor (Pedidos por dia/hora)</h2>
    <div class="heatmap-wrap"><table class="heatmap" id="heatmap"></table></div>
  </div>

  <p class="refresh-note" id="refresh-note">Auto-refresh em <span id="countdown">60</span>s</p>
</div>

<script>
const API = window.API_URL || "http://localhost:5000";

function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
function toggleTheme() { applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"); }
applyTheme(localStorage.getItem("theme") || "dark");

// ── Popular flavors ──────────────────────────────────────────────────────────
async function loadFlavors() {
  try {
    const r = await fetch(`${API}/api/analytics/sabores-populares`);
    const data = await r.json();
    const max = Math.max(...data.map(d => d.total_pedidos), 1);
    document.getElementById("flavors-chart").innerHTML = data.map(d => `
      <div class="bar-row">
        <div class="bar-label" title="${d.nome}">${d.nome}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(d.total_pedidos/max*100).toFixed(1)}%"></div></div>
        <div class="bar-val">${d.total_pedidos}</div>
      </div>`).join("");
  } catch {}
}

// ── NPS ──────────────────────────────────────────────────────────────────────
async function loadNPS() {
  try {
    const r = await fetch(`${API}/api/analytics/satisfacao`);
    const d = await r.json();
    const nps = parseFloat(d.nps) || 0;
    document.getElementById("nps-label").textContent = nps.toFixed(1);
    document.getElementById("nps-sub").textContent = `Média: ${parseFloat(d.media || 0).toFixed(1)}/5 · ${d.total || 0} avaliações`;
    document.getElementById("nps-detail").textContent = d.source === "mock" ? "(dados simulados)" : "";
    // Arc: total arc = 251 (semicircle). Map nps [-100,100] -> [0,251]
    const pct = Math.max(0, Math.min(1, (nps + 100) / 200));
    document.getElementById("nps-arc").setAttribute("stroke-dasharray", `${(pct * 251).toFixed(1)} 251`);
  } catch {}
}

// ── Peak hours canvas ────────────────────────────────────────────────────────
async function loadHours() {
  try {
    const r = await fetch(`${API}/api/analytics/horarios-pico`);
    const data = await r.json();
    const canvas = document.getElementById("hours-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = canvas.offsetWidth || 380;
    const max = Math.max(...data.map(d => d.pedidos), 1);
    const W = canvas.width, H = 140;
    ctx.clearRect(0, 0, W, H);
    const barW = (W - 20) / 24;
    const style = getComputedStyle(document.documentElement);
    const color = style.getPropertyValue("--border-color").trim() || "#00ff41";
    data.forEach(d => {
      const x = 10 + d.hora * barW;
      const barH = (d.pedidos / max) * (H - 24);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(x, H - 20 - barH, barW - 2, barH);
      ctx.globalAlpha = 1;
      if (d.hora % 4 === 0) {
        ctx.fillStyle = style.getPropertyValue("--text-muted").trim() || "#888";
        ctx.font = "10px monospace";
        ctx.fillText(`${d.hora}h`, x, H - 4);
      }
    });
  } catch {}
}

// ── Revenue sparkline ────────────────────────────────────────────────────────
async function loadRevenue() {
  try {
    const r = await fetch(`${API}/api/analytics/receita-mensal`);
    const data = await r.json();
    const svg = document.getElementById("sparkline");
    const W = 400, H = 70;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const vals = data.map(d => parseFloat(d.receita));
    const min = Math.min(...vals), max = Math.max(...vals, 1);
    const pts = vals.map((v, i) => [
      (i / (vals.length - 1)) * (W - 20) + 10,
      H - 8 - ((v - min) / (max - min + 0.001)) * (H - 16)
    ]);
    const style = getComputedStyle(document.documentElement);
    const color = style.getPropertyValue("--border-color").trim() || "#00ff41";
    const polyline = pts.map(p => p.join(",")).join(" ");
    svg.innerHTML = `<polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join("");
    // Labels
    const labels = document.getElementById("sparkline-labels");
    labels.innerHTML = data.filter((_, i) => i % 3 === 0).map(d => `<span>${d.mes.slice(5)}</span>`).join("");
  } catch {}
}

// ── Heatmap ──────────────────────────────────────────────────────────────────
async function loadHeatmap() {
  try {
    const r = await fetch(`${API}/api/analytics/mapa-calor`);
    const data = await r.json();
    const days = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    // Build matrix
    const matrix = Array.from({length:7}, () => new Array(24).fill(0));
    let maxVal = 1;
    data.forEach(d => { matrix[d.dia_semana][d.hora] = d.pedidos; maxVal = Math.max(maxVal, d.pedidos); });
    const style = getComputedStyle(document.documentElement);
    const color = style.getPropertyValue("--border-color").trim() || "#00ff41";
    let html = "<thead><tr><th></th>";
    for (let h = 0; h < 24; h++) html += `<th>${h}</th>`;
    html += "</tr></thead><tbody>";
    matrix.forEach((row, di) => {
      html += `<tr><th>${days[di]}</th>`;
      row.forEach(v => {
        const a = (v / maxVal * 0.85).toFixed(2);
        html += `<td style="background:${color};opacity:${a};title="${v}""></td>`;
      });
      html += "</tr>";
    });
    html += "</tbody>";
    document.getElementById("heatmap").innerHTML = html;
  } catch {}
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
let countdown = 60;
function tick() {
  countdown--;
  document.getElementById("countdown").textContent = countdown;
  if (countdown <= 0) { countdown = 60; loadAll(); }
}

function loadAll() {
  loadFlavors();
  loadNPS();
  loadHours();
  loadRevenue();
  loadHeatmap();
}

loadAll();
setInterval(tick, 1000);
</script>
</body>
</html>
