<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍦 Gelateria Sistema</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00ff41" />
</head>
<body>
  <div id="terminal">
    <div id="header">
      <div id="header-top">
        <span class="prompt">🍦 Gelateria Sistema v2.0</span>
        <div id="header-nav">
          <a href="cardapio.html">🍨 Cardápio</a>
          <a href="ranking.html">🏆 Ranking</a>
          <a href="admin.html">🛠️ Admin</a>
          <a href="dashboard.html">📊 Dashboard</a>
          <a href="estoque.html">📦 Estoque</a>
          <a href="relatorios.html">📈 Relatórios</a>
          <a href="login.html" id="nav-login">🔐 Login</a>
          <span id="nav-user" style="display:none">
            <span id="nav-username" style="font-size:0.85em; padding:3px 6px;"></span>
            <a href="#" id="nav-logout" onclick="handleNavLogout(event)">Sair</a>
          </span>
          <button id="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>
        </div>
      </div>
      <span class="subtitle">Digite 'ajuda' · ↑↓ histórico · 'limpar' para limpar a tela</span>
    </div>

    <div id="output-container">
      <pre id="output">Bem-vindo ao Sistema de Gelateria!
Digite 'ajuda' para ver os comandos disponíveis.
</pre>
    </div>

    <div id="input-area">
      <span class="prompt-symbol">❯</span>
      <input
        type="text"
        id="cmd"
        autocomplete="off"
        placeholder="Digite um comando..."
        autofocus
      />
      <button id="send-btn" onclick="enviarComando()">Enviar</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
      }
    }
    // Restore saved theme
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.textContent = '☀️';
      });
    }
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // Nav login/logout logic
    (function() {
      var token = localStorage.getItem('gelateria_token');
      var user = null;
      try { user = JSON.parse(localStorage.getItem('gelateria_user')); } catch(e) {}
      if (token && user) {
        document.getElementById('nav-login').style.display = 'none';
        document.getElementById('nav-user').style.display = 'inline-flex';
        document.getElementById('nav-user').style.alignItems = 'center';
        document.getElementById('nav-user').style.gap = '6px';
        var nameEl = document.getElementById('nav-username');
        nameEl.textContent = '👤 ' + (user.name || 'Usuário');
      }
    })();
    function handleNavLogout(e) {
      e.preventDefault();
      localStorage.removeItem('gelateria_token');
      localStorage.removeItem('gelateria_user');
      document.getElementById('nav-login').style.display = '';
      document.getElementById('nav-user').style.display = 'none';
    }
  </script>
</body>
</html>
