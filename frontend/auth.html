<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gelateria Pro 🍦</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .auth-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
    }
    .auth-logo { text-align: center; font-size: 48px; margin-bottom: 8px; }
    .auth-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .tab-bar {
      display: flex;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #aaa;
      border: none;
      background: transparent;
      transition: all .2s;
    }
    .tab.active { background: #4fc3f7; color: #0d1117; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; color: #aaa; font-size: 13px; margin-bottom: 6px; }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: #4fc3f7; }
    .form-input::placeholder { color: #555; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
      margin-top: 4px;
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: .9; }
    .btn-google {
      width: 100%;
      padding: 13px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .2s;
    }
    .btn-google:hover { background: rgba(255,255,255,0.12); }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #555;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    #auth-error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      display: none;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">🍦</div>
      <h1 class="auth-title">Gelateria Pro</h1>
      <p class="auth-subtitle">Sua gelateria favorita, na palma da mão</p>

      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('login')">Entrar</button>
        <button class="tab" onclick="switchTab('register')">Cadastrar</button>
      </div>

      <div id="auth-error"></div>

      <!-- Login form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-input" id="login-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Entrar 🚀</button>
      </form>

      <!-- Register form (hidden initially) -->
      <form id="form-register" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-input" id="reg-name" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-input" id="reg-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Senha (mín. 6 caracteres)</label>
          <input type="password" class="form-input" id="reg-password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Data de nascimento</label>
          <input type="date" class="form-input" id="reg-birth">
        </div>
        <button type="submit" class="btn-primary">Criar conta 🎉</button>
      </form>

      <div class="divider">ou</div>
      <button class="btn-google" onclick="showToastGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Entrar com Google (em breve)
      </button>
    </div>
  </div>

  <script>
    const API = '';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      clearError();
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      document.getElementById('auth-error').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearError();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const r = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email, password})
        });
        const d = await r.json();
        if (!r.ok) return showError(d.error || 'Erro ao entrar');
        localStorage.setItem('token', d.token);
        localStorage.setItem('user', JSON.stringify(d.user));
        window.location.href = 'landing.html';
      } catch {
        showError('Erro de conexão. Tente novamente.');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearError();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      try {
        const r = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name, email, password})
        });
        const d = await r.json();
        if (!r.ok) return showError(d.error || 'Erro ao cadastrar');
        localStorage.setItem('token', d.token);
        localStorage.setItem('user', JSON.stringify(d.user));
        window.location.href = 'landing.html';
      } catch {
        showError('Erro de conexão. Tente novamente.');
      }
    }

    function showToastGoogle() {
      alert('Login com Google em breve! 🚀');
    }

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'landing.html';
    }
  </script>
</body>
</html>
