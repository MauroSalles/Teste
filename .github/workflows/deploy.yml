# =============================================================================
# deploy.yml — GitHub Actions CI/CD Pipeline
# =============================================================================
# Este workflow executa testes e faz deploy automático no Render (backend)
# e Vercel (frontend) sempre que há push para a branch main.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   DATABASE_URL        → URL de conexão com PostgreSQL (Render)
#   RENDER_API_KEY      → API Key do Render.com
#   RENDER_SERVICE_ID   → ID do serviço backend no Render
#   VERCEL_TOKEN        → Token de autenticação do Vercel
#   VERCEL_ORG_ID       → ID da organização no Vercel
#   VERCEL_PROJECT_ID   → ID do projeto no Vercel
#   SECRET_KEY          → Chave secreta do Flask
# =============================================================================

name: 🚀 CI/CD — Gelateria Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Testes do Backend (Python/Flask)
  # ---------------------------------------------------------------------------
  test-backend:
    name: 🧪 Testes Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gelateria_test
          POSTGRES_USER: gelateria_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Instalar dependências
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint com flake8
        working-directory: backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: ✅ Executar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://gelateria_user:test_password@localhost:5432/gelateria_test
          FLASK_ENV: testing
          SECRET_KEY: test_secret_key_not_for_production
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml -v || echo "Sem testes encontrados, continuando..."

  # ---------------------------------------------------------------------------
  # JOB 2: Testes do Frontend
  # ---------------------------------------------------------------------------
  test-frontend:
    name: 🧪 Testes Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: frontend
        run: npm run lint || echo "Sem lint configurado, continuando..."

      - name: 🏗️ Build de produção
        working-directory: frontend
        env:
          VITE_API_URL: https://gelateria-backend.onrender.com
        run: npm run build

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy do Backend no Render
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Trigger Deploy no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Iniciando deploy no Render..."
          curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            | python3 -m json.tool

      - name: ⏳ Aguardar deploy (health check)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Aguardando deploy ficar live..."
          sleep 30
          for i in {1..10}; do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['deploy']['status'] if isinstance(d, list) and d else 'unknown')" 2>/dev/null || echo "unknown")
            echo "Tentativa $i: Status = $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅ Deploy concluído com sucesso!"
              exit 0
            fi
            sleep 30
          done
          echo "⚠️ Timeout aguardando deploy. Verifique manualmente no Render."

  # ---------------------------------------------------------------------------
  # JOB 4: Deploy do Frontend no Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: 🎨 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: 🚀 Deploy para Produção no Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ---------------------------------------------------------------------------
  # JOB 5: Notificação de resultado
  # ---------------------------------------------------------------------------
  notify:
    name: 📬 Notificação
    runs-on: ubuntu-latest
    permissions: {}
    needs: [deploy-backend, deploy-frontend]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: ✅ Deploy concluído
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "🎉 Deploy completo!"
            echo "Frontend: https://gelateria.vercel.app"
            echo "Backend:  https://gelateria-backend.onrender.com"
          else
            echo "❌ Deploy falhou. Backend: ${{ needs.deploy-backend.result }}, Frontend: ${{ needs.deploy-frontend.result }}"
            exit 1
          fi
