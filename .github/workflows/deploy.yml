name: CI/CD — Gelateria System

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Lint & Test (Python backend)
  # ─────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gelateria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: gelateria_test
      DB_USER: postgres
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379
      FLASK_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov flake8

      - name: Lint (Flake8)
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Init test database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d gelateria_test -f database/schema.sql

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
        continue-on-error: true

  # ─────────────────────────────────────────────────────────
  # 2. Test Frontend
  # ─────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          if [ ! -f frontend/index.html ]; then
            echo "❌ frontend/index.html not found"
            exit 1
          fi
          echo "✅ frontend/index.html exists"

      - name: Check frontend assets
        run: |
          for f in frontend/style.css frontend/script.js; do
            if [ ! -f "$f" ]; then
              echo "❌ $f not found"
              exit 1
            fi
          done
          echo "✅ All frontend assets present"

  # ─────────────────────────────────────────────────────────
  # 3. Build Docker image (validates Dockerfile)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gelateria-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # 4. Deploy backend to Render (on push to main only)
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repo Settings → Secrets

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Render to deploy..."
          sleep 30
          echo "✅ Deploy hook triggered"

  # ─────────────────────────────────────────────────────────
  # 5. Deploy frontend to Vercel (on push to main only)
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [test-frontend, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel deploy --prod \
            --yes \
            --cwd frontend \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub Secrets

  # ─────────────────────────────────────────────────────────
  # 6. Smoke Tests (after both deployments)
  # ─────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    steps:
      - name: Health Check Backend
        run: |
          curl -f "${{ secrets.RENDER_API_URL }}/health" || exit 1
        continue-on-error: true

      - name: Health Check Frontend
        run: |
          curl -f "${{ secrets.VERCEL_APP_URL }}" || exit 1
        continue-on-error: true

  # ─────────────────────────────────────────────────────────
  # 7. Slack Notification
  # ─────────────────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, smoke-tests]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚀 Gelateria Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*\nBackend: ${{ needs.deploy-backend.result }}\nFrontend: ${{ needs.deploy-frontend.result }}\nSmoke Tests: ${{ needs.smoke-tests.result }}\nCommit: <${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  }
                }
              ]
            }
        continue-on-error: true

