# Gelateria Pro — nginx reverse proxy configuration
# Routes /api/* and /ws/* to the Flask backend; serves static frontend files
# from /usr/share/nginx/html for all other paths.

# Cache zone for API responses (1 MB of keys, 10 MB of data, 1-minute TTL)
proxy_cache_path /tmp/nginx_cache
    levels=1:2
    keys_zone=api_cache:1m
    max_size=10m
    inactive=1m
    use_temp_path=off;

upstream backend {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # --- Gzip compression for text assets ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 256;

    # -----------------------------------------------------------------------
    # /health — lightweight liveness probe forwarded to the backend
    # -----------------------------------------------------------------------
    location = /health {
        proxy_pass         http://backend/health;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
        access_log         off;
    }

    # -----------------------------------------------------------------------
    # /infra/healthz — infrastructure health check (not cached)
    # -----------------------------------------------------------------------
    location = /infra/healthz {
        proxy_pass         http://backend/infra/healthz;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # -----------------------------------------------------------------------
    # /api/* — REST API reverse proxy with short-lived caching for GETs
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass             http://backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     30s;
        proxy_connect_timeout  5s;

        # Cache only safe GET/HEAD requests
        proxy_cache            api_cache;
        proxy_cache_methods    GET HEAD;
        proxy_cache_valid      200 30s;
        proxy_cache_bypass     $http_authorization;
        proxy_no_cache         $http_authorization;
        add_header             X-Cache-Status $upstream_cache_status always;

        # Graceful fallback: return a JSON error instead of a blank page
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_fallback;
    }

    # Fallback JSON response when backend is unreachable
    location @api_fallback {
        default_type application/json;
        return 503 '{"error":"Serviço temporariamente indisponível. Tente novamente em instantes.","status":"degraded"}';
    }

    # -----------------------------------------------------------------------
    # /ws — WebSocket upgrade (for real-time features)
    # -----------------------------------------------------------------------
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # -----------------------------------------------------------------------
    # /cmd — legacy terminal endpoint
    # -----------------------------------------------------------------------
    location /cmd {
        proxy_pass            http://backend/cmd;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Static frontend — served directly from /usr/share/nginx/html
    # -----------------------------------------------------------------------
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache static assets aggressively; HTML with a short TTL
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires    30d;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.html$ {
            expires    5m;
            add_header Cache-Control "public, must-revalidate";
        }
    }
}
