# Render.com Infrastructure as Code
# https://render.com/docs/render-yaml

services:
  - type: web
    name: gelateria-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gelateria-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard to your Vercel URL
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "10"

databases:
  - name: gelateria-db
    databaseName: gelateria
    user: postgres
    plan: free
    postgresMajorVersion: 16
