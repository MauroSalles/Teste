# Render.com configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: gelateria-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gelateria-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard

databases:
  - name: gelateria-db
    databaseName: gelateria
    user: postgres
    plan: free
    postgresMajorVersion: 16
