# Render.com configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: gelateria-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:${PORT} --workers 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gelateria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gelateria-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard
      - key: SENTRY_DSN
        sync: false   # set manually in Render dashboard
      - key: RELEASE_VERSION
        value: "1.0.0"

  - type: redis
    name: gelateria-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  - name: gelateria-db
    databaseName: gelateria
    user: postgres
    plan: starter
    region: oregon
    postgresMajorVersion: 16

