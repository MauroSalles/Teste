## =============================================================================
## render.yaml — Configuração de Deploy Automático no Render.com
## =============================================================================
## Este arquivo define todos os serviços do projeto para o Render.com.
## Commit este arquivo na raiz do repositório e o Render detecta automaticamente.
## Docs: https://render.com/docs/infrastructure-as-code
## =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — API Flask (Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: gelateria-backend
    runtime: python
    region: oregon          # Região mais próxima do Brasil disponível no plano free
    plan: free              # Altere para "starter" ($7/mês) para evitar cold starts
    branch: main
    rootDir: backend        # Ajuste se o código backend estiver em outro diretório

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    healthCheckPath: /health  # Endpoint de health check na sua API Flask

    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true   # Render gera automaticamente um valor seguro
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: gelateria-db  # Referência ao banco de dados abaixo
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://gelateria.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ---------------------------------------------------------------------------
  # Frontend estático (se não usar Vercel)
  # Descomente este bloco se quiser hospedar o frontend no Render também
  # ---------------------------------------------------------------------------
  # - type: static_site
  #   name: gelateria-frontend
  #   branch: main
  #   rootDir: frontend
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
  #   envVars:
  #     - key: VITE_API_URL
  #       value: https://gelateria-backend.onrender.com

# -----------------------------------------------------------------------------
# Banco de Dados — PostgreSQL
# -----------------------------------------------------------------------------
databases:
  - name: gelateria-db
    databaseName: gelateria
    user: gelateria_user
    region: oregon
    plan: free              # PostgreSQL gratuito por 90 dias; depois ~$7/mês
    # ipAllowList: []       # Deixe vazio para permitir apenas serviços internos
