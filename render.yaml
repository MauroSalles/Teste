# Render.com configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: gelateria-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /infra/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gelateria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gelateria-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # set to your Vercel/CDN frontend URL

databases:
  - name: gelateria-db
    databaseName: gelateria
    user: postgres
    plan: free
    postgresMajorVersion: 16

# Redis managed service
# NOTE: Render free-tier Redis is available; upgrade for persistence.
# Alternatives: Railway Redis, Upstash (free tier), Neon (Postgres only).
redis:
  - name: gelateria-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
