version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: gelateria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gelateria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    # Horizontal scaling options:
    #   Docker Compose standalone: docker compose up --scale backend=3
    #   Docker Swarm mode only: set deploy.replicas below (ignored by Compose standalone)
    # For Swarm mode (docker stack deploy), uncomment the deploy block:
    # deploy:
    #   replicas: ${BACKEND_REPLICAS:-1}
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     max_attempts: 3
    #   resources:
    #     limits:
    #       cpus: "${BACKEND_CPU_LIMIT:-1.0}"
    #       memory: "${BACKEND_MEM_LIMIT:-512M}"
    container_name: gelateria_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: gelateria
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_PORT: 5432
      FLASK_ENV: development
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5500"
      # Tenant / white-label config (override for spin-offs)
      TENANT_ID: ${TENANT_ID:-gelateria_pro}
      TENANT_NAME: ${TENANT_NAME:-Gelateria Pro}
      TENANT_CURRENCY: ${TENANT_CURRENCY:-BRL}
      TENANT_LOCALE: ${TENANT_LOCALE:-pt_BR}
      TENANT_TIMEZONE: ${TENANT_TIMEZONE:-America/Sao_Paulo}
      # Feature flags (set to 1 to enable)
      FEATURE_MARKETPLACE: ${FEATURE_MARKETPLACE:-0}
      FEATURE_FRANCHISE_PORTAL: ${FEATURE_FRANCHISE_PORTAL:-0}
      FEATURE_PUBLIC_API: ${FEATURE_PUBLIC_API:-0}
      FEATURE_I18N: ${FEATURE_I18N:-1}
      FEATURE_AB_TEST: ${FEATURE_AB_TEST:-0}
      FEATURE_SPIN_OFF: ${FEATURE_SPIN_OFF:-0}
      # Public API keys (comma-separated)
      PARTNER_API_KEYS: ${PARTNER_API_KEYS:-}
      # App version for OpenAPI spec
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    container_name: gelateria_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  db_data:
